# Behind Cloudflare and the bots' Caddy. Caddy's own X-Forwarded-For holds a
# Cloudflare edge address, so the visitor's address comes from
# CF-Connecting-IP; Django's per-IP contact limits key on it.
map $http_cf_connecting_ip $visitor_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

upstream django {
    server web:8000;
}

# ismatov.uz: the portfolio SPA, plus the Django API, admin and static files.
server {
    listen 80;
    server_name ismatov.uz www.ismatov.uz;
    root /srv/main;
    client_max_body_size 10m;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $visitor_ip;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# beta.ismatov.uz: the 3D rewrite, kept out of search results while visitors
# test it. Same API, so its messages land in the same database.
server {
    listen 80;
    server_name beta.ismatov.uz;
    root /srv/beta;

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $visitor_ip;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri/ /index.html;
    }
}
